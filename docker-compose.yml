services:
  postgres:
    image: postgres:16
    container_name: tutor_db
    restart: always
    environment:
      POSTGRES_USER: tutor_admin
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: tutor_website
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: